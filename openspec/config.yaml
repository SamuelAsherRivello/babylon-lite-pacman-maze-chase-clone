schema: spec-driven
context: |
  Repository: babylon-lite-pacman-maze-chase-clone. Product: Neon Nibbler.
  Original single-player landscape maze chase for desktop and mobile browsers.
  Use Babylon Lite WebGPU sprite rendering, vanilla JavaScript, and Vite.
  Pure fixed-step game rules are independent of rendering and input.
  Three authored boards, four enemy personalities, power pellets, three lives.
  Preserve project-name/ as application root and the four template corner roles.
  Commands: npm ci, npm test, npm run build, npm run dev, npm run test:browser.
  Release patch versions through the existing GitHub Actions release workflow
  and publish under /babylon-lite-pacman-maze-chase-clone/ on GitHub Pages.
  Canonical project documentation assets live in project-name/documentation/.
  Before proposing or applying a change, record the project's verified purpose,
  runtime targets, architecture, dependency policy, security constraints, and
  validation commands here.
rules:
  proposal:
    - Mark unresolved decisions clearly; recommendations are not approvals.
    - State the affected user behavior and acceptance criteria.
  design:
    - Describe only architecture and technologies verified for this project.
    - Preserve explicit boundaries between application layers or packages.
  tasks:
    - Keep planning, implementation, and verification tasks explicit.
    - Include focused checks appropriate to the implemented change.

